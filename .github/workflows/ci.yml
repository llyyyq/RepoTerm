name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Compile sources
        run: python -m compileall -q repoterm tests benchmarks Main Package

      - name: AGENTS structure compliance
        run: python -m repoterm.structure_check --root . --hotspots 5 --max-dependency-upstream 4 --check-material-inventory --report .temp/structure-compliance.json

      - name: Runtime readiness gate
        run: python -m repoterm.readiness --json

      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          python -m ruff check repoterm/ --select=E,F --ignore=E501

      - name: Type check (mypy baseline)
        shell: bash
        run: |
          python -m pip install mypy
          # Baseline: 225 errors. Gradual type hardening — fix real bugs, not just noise.
          ERRORS=$(python -m mypy repoterm/ --no-error-summary 2>&1 | grep -c "error:" || echo 0)
          echo "mypy errors: $ERRORS (baseline 225)"
          if [ "$ERRORS" -gt 225 ]; then
            echo "FAIL: mypy errors increased above baseline"
            exit 1
          fi

      - name: Run AGENTS mirror tests
        run: >
          python -m pytest -q --import-mode=importlib
          Main/RepoTermFrontline/Test/Application/Dto/AppProjection.Test.py
          Main/RepoTermFrontline/Test/Application/Entry/RepoTermFrontline.Test.py
          Main/RepoTermFrontline/Test/Application/Entry/LocalCommandSurface.Test.py
          Main/RepoTermFrontline/Test/Application/Entry/RuntimeLifecycleSurface.Test.py
          Main/RepoTermFrontline/Test/Application/Query/CurrentRuntimeProjection.Test.py
          Main/RepoTermFrontline/Test/Application/Query/RuntimeCapabilityInventory.Test.py
          Package/EngineeringStructure/Test/Application/Query/ProductRootProjection.Test.py
          Package/EngineeringStructure/Test/Application/Query/StructureCompliance.Test.py

      - name: Run test suite
        run: python -m pytest -q --tb=short
